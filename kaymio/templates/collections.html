<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kaymio Collections</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0f172a;
        color: #e2e8f0;
      }
      .wrap {
        max-width: 1200px;
        margin: 0 auto;
        padding: 24px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.6rem;
      }
      h2 {
        font-size: 1.2rem;
        margin: 0 0 12px;
      }
      .muted {
        color: #94a3b8;
        margin: 0 0 16px;
      }
      .toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
        gap: 12px;
      }
      .btn {
        border: 1px solid #334155;
        background: #1e293b;
        color: #e2e8f0;
        padding: 8px 12px;
        border-radius: 8px;
        text-decoration: none;
        cursor: pointer;
        font-size: 0.9rem;
      }
      .btn:hover { background: #273449; }
      .btn-primary {
        background: #4f46e5;
        border-color: #4338ca;
      }
      .btn-primary:hover { background: #4338ca; }
      .btn-danger {
        background: #7f1d1d;
        border-color: #991b1b;
      }
      .btn:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .layout {
        display: grid;
        grid-template-columns: 360px 1fr;
        gap: 20px;
        align-items: flex-start;
      }
      @media (max-width: 900px) {
        .layout { grid-template-columns: 1fr; }
      }
      .panel {
        background: #111827;
        border: 1px solid #1f2937;
        border-radius: 12px;
        padding: 18px;
      }
      .field { margin-bottom: 12px; }
      .field label {
        display: block;
        font-size: 0.85rem;
        color: #94a3b8;
        margin-bottom: 6px;
      }
      .field input, .field textarea {
        width: 100%;
        background: #0b1220;
        border: 1px solid #334155;
        color: #e2e8f0;
        border-radius: 8px;
        padding: 8px 10px;
        font-family: inherit;
        font-size: 0.95rem;
        box-sizing: border-box;
      }
      .field textarea { min-height: 80px; resize: vertical; }
      .collection-card {
        border: 1px solid #1f2937;
        border-radius: 10px;
        padding: 12px 14px;
        margin-bottom: 10px;
        cursor: pointer;
        transition: border-color 0.15s ease, background 0.15s ease;
      }
      .collection-card:hover { border-color: #4f46e5; }
      .collection-card.active {
        border-color: #4f46e5;
        background: #1a1f3a;
      }
      .collection-card .name {
        font-weight: 600;
        margin-bottom: 4px;
      }
      .collection-card .desc {
        font-size: 0.85rem;
        color: #94a3b8;
        overflow: hidden;
        text-overflow: ellipsis;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
      }
      .badge {
        display: inline-block;
        font-size: 0.75rem;
        padding: 2px 8px;
        border-radius: 999px;
        margin-bottom: 6px;
      }
      .badge.draft { background: #334155; color: #cbd5e1; }
      .badge.published { background: #14532d; color: #bbf7d0; }
      .flash {
        padding: 10px 12px;
        border-radius: 8px;
        margin-bottom: 12px;
      }
      .flash.success { background: #14532d; }
      .flash.error { background: #7f1d1d; }
      .empty-state {
        color: #94a3b8;
        text-align: center;
        padding: 40px 0;
      }
      .product-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
        gap: 10px;
        margin-top: 8px;
      }
      .product-card {
        border: 1px solid #1f2937;
        border-radius: 8px;
        overflow: hidden;
        background: #0b1220;
        text-decoration: none;
        color: inherit;
      }
      .product-card img {
        width: 100%;
        aspect-ratio: 1/1;
        object-fit: cover;
        display: block;
        background: #1f2937;
      }
      .product-card .ptitle {
        font-size: 0.75rem;
        padding: 6px 8px;
        text-align: center;
      }
      .section { margin-bottom: 20px; }
      .hashtags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
      .hashtag {
        background: #1e293b;
        border-radius: 999px;
        padding: 2px 10px;
        font-size: 0.8rem;
        color: #93c5fd;
      }
      .caption-box {
        background: #0b1220;
        border: 1px solid #334155;
        border-radius: 8px;
        padding: 10px 12px;
        white-space: pre-wrap;
        font-size: 0.9rem;
        line-height: 1.5;
      }
      iframe.landing-preview {
        width: 100%;
        height: 480px;
        border: 1px solid #334155;
        border-radius: 8px;
        background: #fff;
      }
      .actions-row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 8px;
      }
      .link-line {
        font-size: 0.85rem;
        color: #93c5fd;
        word-break: break-all;
      }
      .spinner {
        display: inline-block;
        width: 14px;
        height: 14px;
        border: 2px solid #475569;
        border-top-color: #e2e8f0;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        vertical-align: middle;
        margin-right: 6px;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="toolbar">
        <div>
          <h1>Instagram Collections</h1>
          <p class="muted">Curate WooCommerce products into an Instagram carousel + landing page.</p>
        </div>
        <a class="btn" href="{{ url_for('home') }}">Back</a>
      </div>

      <div id="flash-box"></div>

      <div class="layout">
        <div>
          <div class="panel section">
            <h2>New collection</h2>
            <div class="field">
              <label for="new-name">Name</label>
              <input id="new-name" type="text" placeholder="e.g. Summer Seaside" />
            </div>
            <div class="field">
              <label for="new-description">Description / theme</label>
              <textarea id="new-description" placeholder="Describe the theme so we can match related products (e.g. beach essentials, swimwear, coastal home decor)"></textarea>
            </div>
            <button class="btn btn-primary" id="create-btn">Create draft</button>
          </div>

          <div class="panel">
            <h2>Collections</h2>
            <div id="collection-list">
              <div class="empty-state">Loading...</div>
            </div>
          </div>
        </div>

        <div class="panel" id="detail-panel">
          <div class="empty-state">Select a collection to view details, or create a new one.</div>
        </div>
      </div>
    </div>

    <script>
      const API_BASE = "{{ url_for('collections.api_list_collections') }}";
      const listEl = document.getElementById("collection-list");
      const detailEl = document.getElementById("detail-panel");
      const flashBox = document.getElementById("flash-box");
      let collections = [];
      let activeId = null;

      function esc(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function flash(message, kind) {
        flashBox.innerHTML = `<div class="flash ${kind}">${esc(message)}</div>`;
        setTimeout(() => { flashBox.innerHTML = ""; }, 6000);
      }

      async function api(path, options) {
        const res = await fetch(path, {
          headers: { "Content-Type": "application/json" },
          ...options,
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          const err = new Error(data.error || `Request failed (${res.status})`);
          err.data = data;
          throw err;
        }
        return data;
      }

      function renderList() {
        if (!collections.length) {
          listEl.innerHTML = '<div class="empty-state">No collections yet. Create your first one above.</div>';
          return;
        }
        listEl.innerHTML = collections.map((c) => `
          <div class="collection-card ${c.id === activeId ? "active" : ""}" data-id="${c.id}">
            <span class="badge ${c.status}">${esc(c.status)}</span>
            <div class="name">${esc(c.name)}</div>
            <div class="desc">${esc(c.description || "")}</div>
          </div>
        `).join("");
        listEl.querySelectorAll(".collection-card").forEach((card) => {
          card.addEventListener("click", () => openCollection(Number(card.dataset.id)));
        });
      }

      async function loadCollections() {
        try {
          const data = await api(API_BASE);
          collections = data.collections || [];
          renderList();
        } catch (err) {
          listEl.innerHTML = `<div class="empty-state">${esc(err.message)}</div>`;
        }
      }

      function productCard(p) {
        const img = p.image_url
          ? `<img src="${esc(p.image_url)}" alt="${esc(p.title || "")}" />`
          : '<div style="aspect-ratio:1/1;background:#1f2937;"></div>';
        return `
          <a class="product-card" href="${esc(p.product_url || "#")}" target="_blank" rel="noopener">
            ${img}
            <div class="ptitle">${esc(p.title || "")}</div>
          </a>
        `;
      }

      function renderDetail(c) {
        const products = c.products || [];
        const hashtags = c.hashtags || [];

        const productsHtml = products.length
          ? `<div class="product-grid">${products.map(productCard).join("")}</div>`
          : '<p class="muted">No products yet. Click "Generate content" to find related products and create the caption + landing page.</p>';

        const captionHtml = c.caption
          ? `<div class="caption-box">${esc(c.caption)}</div>`
          : '<p class="muted">Not generated yet.</p>';

        const hashtagsHtml = hashtags.length
          ? `<div class="hashtags">${hashtags.map((h) => `<span class="hashtag">#${esc(h)}</span>`).join("")}</div>`
          : "";

        const landingHtml = c.landing_page_html
          ? `<iframe class="landing-preview" srcdoc="${esc(c.landing_page_html)}"></iframe>`
          : '<p class="muted">Not generated yet.</p>';

        const canPublish = products.length >= 2 && !!c.landing_page_html;
        const publishedInfo = (c.wordpress_page_url || c.instagram_media_id)
          ? `
            <div class="field">
              <label>Published</label>
              ${c.wordpress_page_url ? `<div class="link-line">Landing page: <a href="${esc(c.wordpress_page_url)}" target="_blank" rel="noopener" style="color:#93c5fd;">${esc(c.wordpress_page_url)}</a></div>` : ""}
              ${c.instagram_media_id ? `<div class="link-line">Instagram media ID: ${esc(c.instagram_media_id)}</div>` : '<div class="link-line" style="color:#fca5a5;">Instagram post not published yet.</div>'}
            </div>
          `
          : "";

        detailEl.innerHTML = `
          <div class="toolbar">
            <div>
              <span class="badge ${c.status}">${esc(c.status)}</span>
              <h2 style="margin-top:4px;">${esc(c.name)}</h2>
            </div>
            <button class="btn btn-danger" id="delete-btn">Delete</button>
          </div>

          <div class="section">
            <div class="field">
              <label for="detail-description">Description / theme</label>
              <textarea id="detail-description">${esc(c.description || "")}</textarea>
            </div>
            <button class="btn" id="save-btn">Save</button>
          </div>

          <div class="section">
            <h2>Caption</h2>
            ${captionHtml}
            ${hashtagsHtml}
          </div>

          <div class="section">
            <h2>Products (top 5 related)</h2>
            ${productsHtml}
          </div>

          <div class="section">
            <h2>Landing page preview</h2>
            ${landingHtml}
          </div>

          ${publishedInfo}

          <div class="actions-row">
            <button class="btn btn-primary" id="generate-btn">
              ${c.landing_page_html ? "Regenerate content" : "Generate content"}
            </button>
            <button class="btn btn-primary" id="publish-btn" ${canPublish ? "" : "disabled"}>
              ${c.status === "published" ? "Re-publish" : "Publish"}
            </button>
          </div>
          <div id="detail-status" class="muted" style="margin-top:8px;"></div>
        `;

        document.getElementById("delete-btn").addEventListener("click", () => deleteCollection(c.id));
        document.getElementById("save-btn").addEventListener("click", () => saveDescription(c.id));
        document.getElementById("generate-btn").addEventListener("click", () => generateCollection(c.id));
        document.getElementById("publish-btn").addEventListener("click", () => publishCollection(c.id));
      }

      function setStatus(message, spinning) {
        const el = document.getElementById("detail-status");
        if (!el) return;
        el.innerHTML = spinning ? `<span class="spinner"></span>${esc(message)}` : esc(message);
      }

      async function openCollection(id) {
        activeId = id;
        renderList();
        detailEl.innerHTML = '<div class="empty-state">Loading...</div>';
        try {
          const data = await api(`${API_BASE}/${id}`);
          renderDetail(data.collection);
        } catch (err) {
          detailEl.innerHTML = `<div class="empty-state">${esc(err.message)}</div>`;
        }
      }

      async function saveDescription(id) {
        const description = document.getElementById("detail-description").value;
        try {
          const data = await api(`${API_BASE}/${id}`, {
            method: "PUT",
            body: JSON.stringify({ description }),
          });
          renderDetail(data.collection);
          await loadCollections();
          flash("Saved.", "success");
        } catch (err) {
          flash(err.message, "error");
        }
      }

      async function generateCollection(id) {
        setStatus("Finding related products and generating content (this can take a minute)...", true);
        document.getElementById("generate-btn").disabled = true;
        document.getElementById("publish-btn").disabled = true;
        try {
          const data = await api(`${API_BASE}/${id}/generate`, { method: "POST", body: JSON.stringify({}) });
          renderDetail(data.collection);
          await loadCollections();
          flash("Content generated.", "success");
        } catch (err) {
          flash(err.message, "error");
          setStatus("", false);
          document.getElementById("generate-btn").disabled = false;
        }
      }

      async function publishCollection(id) {
        if (!confirm("This will create a live WordPress page and post a real Instagram carousel. Continue?")) {
          return;
        }
        setStatus("Publishing to WordPress and Instagram...", true);
        document.getElementById("generate-btn").disabled = true;
        document.getElementById("publish-btn").disabled = true;
        try {
          const data = await api(`${API_BASE}/${id}/publish`, { method: "POST", body: JSON.stringify({}) });
          renderDetail(data.collection);
          await loadCollections();
          flash("Published!", "success");
        } catch (err) {
          flash(err.message, "error");
          if (err.data && err.data.collection) {
            renderDetail(err.data.collection);
            await loadCollections();
          } else {
            setStatus("", false);
            document.getElementById("generate-btn").disabled = false;
            document.getElementById("publish-btn").disabled = false;
          }
        }
      }

      async function deleteCollection(id) {
        if (!confirm("Delete this collection? This does not remove the live WordPress page or Instagram post.")) {
          return;
        }
        try {
          await api(`${API_BASE}/${id}`, { method: "DELETE" });
          activeId = null;
          detailEl.innerHTML = '<div class="empty-state">Select a collection to view details, or create a new one.</div>';
          await loadCollections();
          flash("Collection deleted.", "success");
        } catch (err) {
          flash(err.message, "error");
        }
      }

      document.getElementById("create-btn").addEventListener("click", async () => {
        const name = document.getElementById("new-name").value.trim();
        const description = document.getElementById("new-description").value.trim();
        if (!name) {
          flash("Please enter a collection name.", "error");
          return;
        }
        try {
          const data = await api(API_BASE, { method: "POST", body: JSON.stringify({ name, description }) });
          document.getElementById("new-name").value = "";
          document.getElementById("new-description").value = "";
          await loadCollections();
          openCollection(data.collection.id);
          flash("Draft created.", "success");
        } catch (err) {
          flash(err.message, "error");
        }
      });

      loadCollections();
    </script>
  </body>
</html>
