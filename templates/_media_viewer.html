<div class="media-viewer" data-media-viewer hidden>
  <div class="media-viewer__backdrop" data-media-viewer-close></div>
  <div class="media-viewer__dialog" role="dialog" aria-modal="true" aria-label="Media viewer">
    <button type="button" class="media-viewer__close" data-media-viewer-close aria-label="Close viewer">
      ×
    </button>
    <div class="media-viewer__stage">
      <img class="media-viewer__image" data-media-viewer-image alt="" hidden />
      <video class="media-viewer__video" data-media-viewer-video controls playsinline hidden></video>
    </div>
    <div class="media-viewer__footer">
      <div>
        <p class="media-viewer__title" data-media-viewer-title></p>
        <p class="media-viewer__meta" data-media-viewer-meta></p>
      </div>
      <a class="ghost-btn" data-media-viewer-download href="#" download>Download</a>
    </div>
  </div>
</div>
