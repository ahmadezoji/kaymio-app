name: ci-cd

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

concurrency:
  group: kaymio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate source compiles
        run: python -m compileall kaymio/ run.py migrate_json_to_db.py

  deploy:
    if: github.event_name == 'push'
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Trust deploy host
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy on server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_REF: ${{ github.sha }}
        run: |
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "bash -s" <<EOF
          set -e
          cd "${DEPLOY_PATH}"

          # Backup local token/credential files (they're generated locally, not from repo)
          echo "Backing up local credentials..."
          mkdir -p /tmp/kaymio-backup
          ENV_BACKED_UP=false
          for file in .env kaymio/integrations/instagram/instagram_token.json kaymio/integrations/youtube/youtube_access_token.txt kaymio/integrations/tiktok/tiktok_access_token.txt kaymio/integrations/pintrest/pintrest_access_token.txt; do
            if [ -f "\$file" ]; then
              cp "\$file" "/tmp/kaymio-backup/\$(basename \$file)" 2>/dev/null || true
              [ "\$(basename \$file)" = ".env" ] && ENV_BACKED_UP=true
            fi
          done

          # Remove conflicting files so git checkout can proceed
          echo "Removing conflicting files for git checkout..."
          git rm --cached kaymio/integrations/instagram/instagram_token.json kaymio/integrations/youtube/youtube_access_token.txt kaymio/integrations/tiktok/tiktok_access_token.txt kaymio/integrations/pintrest/pintrest_access_token.txt .env 2>/dev/null || true
          rm -f kaymio/integrations/instagram/instagram_token.json kaymio/integrations/youtube/youtube_access_token.txt kaymio/integrations/tiktok/tiktok_access_token.txt kaymio/integrations/pintrest/pintrest_access_token.txt .env

          # Update code
          echo "Pulling latest code..."
          git fetch --all --tags --prune

          # Discard any local edits to tracked files (e.g. docker-compose.yml
          # tweaked directly on the server) so checkout doesn't abort.
          git checkout -- . 2>/dev/null || true

          git checkout "${DEPLOY_REF}"

          # Restore local token/credential files from backup
          echo "Restoring backed-up credentials..."
          for file in /tmp/kaymio-backup/*; do
            if [ -f "\$file" ]; then
              case "\$(basename \$file)" in
                instagram_token.json) cp "\$file" "kaymio/integrations/instagram/instagram_token.json" && echo "✓ Restored instagram_token.json" ;;
                youtube_access_token.txt) cp "\$file" "kaymio/integrations/youtube/youtube_access_token.txt" && echo "✓ Restored youtube_access_token.txt" ;;
                tiktok_access_token.txt) cp "\$file" "kaymio/integrations/tiktok/tiktok_access_token.txt" && echo "✓ Restored tiktok_access_token.txt" ;;
                pintrest_access_token.txt) cp "\$file" "kaymio/integrations/pintrest/pintrest_access_token.txt" && echo "✓ Restored pintrest_access_token.txt" ;;
                .env) cp "\$file" ".env" && echo "✓ Restored .env from backup" ;;
              esac
            fi
          done

          # Ensure .env exists (critical for Docker Compose)
          if [ ! -f ".env" ]; then
            echo "⚠ .env not found. Creating default..."
            echo "DB_HOST=db" > .env
            echo "DB_PORT=3306" >> .env
            echo "DB_NAME=kaymio_dev" >> .env
            echo "DB_USER=kaymio" >> .env
            echo "DB_PASSWORD=kaymio" >> .env
            echo "MYSQL_ROOT_PASSWORD=rootpass" >> .env
            echo "MYSQL_DATABASE=kaymio_dev" >> .env
            echo "FLASK_SECRET_KEY=dev-secret-key-change-in-production" >> .env
            echo "FLASK_DEBUG=0" >> .env
            echo "PORT=8081" >> .env
            echo "INSTAGRAM_STORY_AUTOPUBLISH_ENABLED=1" >> .env
            echo "INSTAGRAM_STORY_AUTOPUBLISH_TIME=11:50" >> .env
            echo "INSTAGRAM_STORY_AUTOPUBLISH_COUNT=2" >> .env
            echo "ADMIN_DEFAULT_USERNAME=admin" >> .env
            echo "ADMIN_DEFAULT_PASSWORD=admin123" >> .env
            echo "ADMIN_DEFAULT_EMAIL=admin@kaymio.com" >> .env
            echo "STATE_DIR=data" >> .env
            echo "✓ Default .env created"
          else
            echo "✓ .env exists"
          fi

          # Deploy
          echo "Deploying Docker containers..."
          docker compose up -d --build --remove-orphans
          docker image prune -f
          echo "✓ Deployment complete"
          EOF
