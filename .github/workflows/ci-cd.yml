name: ci-cd

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

concurrency:
  group: kaymio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate source compiles
        run: python -m compileall kaymio/ run.py migrate_json_to_db.py

  deploy:
    if: github.event_name == 'push'
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Trust deploy host
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy on server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_REF: ${{ github.sha }}
        run: |
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "bash -s" <<EOF
          set -e
          cd "${DEPLOY_PATH}"

          # .env and the legacy OAuth token files are gitignored/untracked,
          # so a git checkout never touches or conflicts with them. Only
          # discard local edits to *tracked* files (e.g. docker-compose.yml
          # tweaked directly on the server) so checkout doesn't abort.
          echo "Pulling latest code..."
          git fetch --all --tags --prune
          git checkout -- .
          git checkout "${DEPLOY_REF}"

          # .env holds real secrets (WooCommerce, WordPress, OpenAI,
          # Instagram, etc.) and must already exist on the server - never
          # auto-generate a stripped placeholder here, since that silently
          # wipes production credentials.
          if [ ! -f ".env" ]; then
            echo "ERROR: .env is missing on the server. Restore the real .env before retrying the deploy."
            exit 1
          fi

          # Deploy
          echo "Deploying Docker containers..."
          docker compose up -d --build --remove-orphans
          docker image prune -f
          echo "✓ Deployment complete"
          EOF
